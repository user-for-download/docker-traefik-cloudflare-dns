services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    security_opt:
      - no-new-privileges:true
    restart: always
    profiles:
      - apps
      - all
    networks:
      - net_t2
    environment:
      - TZ=${TZ}
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
    volumes:
      - navidrome:/data
      - ${DOCKERDIR}/music:/music:ro
    labels:
      traefik.enable: true
      traefik.http.routers.navidrome-rtr.entrypoints: https
      traefik.http.routers.navidrome-rtr.rule: Host(`music.${DOMAINNAME}`)
      traefik.http.routers.navidrome-rtr.tls: true
      traefik.http.routers.navidrome-rtr.service: navidrome-svc
      traefik.http.services.navidrome-svc.loadbalancer.server.port: 4533
      traefik.http.routers.navidrome-rtr.middlewares: chain-internal@file
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - http://127.0.0.1:4533
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
