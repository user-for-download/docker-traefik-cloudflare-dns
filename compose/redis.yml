services:
  redis:
    container_name: redis
    image: redis:alpine
    security_opt:
      - no-new-privileges:true
    restart: always
    profiles:
      - database
      - all
    networks:
      - net_redis
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    command: sh -c 'redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"'
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$(cat /run/secrets/redis_password)" ping
      interval: 30s
      timeout: 5s
      retries: 3
