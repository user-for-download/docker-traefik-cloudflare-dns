global:
  checkNewVersion: true
  sendAnonymousUsage: false

ping:
  entryPoint: ping

entryPoints:
  http:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ':443'
  ping:
    address: ':8082'

api:
  dashboard: true
  insecure: false

log:
  filePath: /logs/traefik.json
  format: json
  level: INFO
  maxSize: 50
  maxAge: 14
  maxBackups: 5
  compress: true

accessLog:
  filePath: /logs/access.json
  format: json
  bufferingSize: 100
  filters:
    retryAttempts: true
    statusCodes:
      - 200-599
  fields:
    names:
      StartUTC: drop

# ============================================
# Certificate resolver for production HTTPS certificates.
# Local mode uses the certificate loaded by rules/tls.yml instead.
# ============================================
certificatesResolvers:
  dns-cloudflare:
    acme:
      caServer: 'https://acme-v02.api.letsencrypt.org/directory'
      email: '{{env "ACME_EMAIL"}}'
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: 90s
        resolvers:
          - '1.1.1.1:53'
          - '1.0.0.1:53'

providers:
  docker:
    endpoint: 'tcp://socket-proxy:2375'
    exposedByDefault: false
    network: net_t2
  file:
    directory: /etc/traefik/rules
    watch: true

# Uncomment to enable InfluxDB metrics
# metrics:
#   influxDB2:
#     addEntryPointsLabels: true
