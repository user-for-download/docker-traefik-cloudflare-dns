http:
  routers:
    traefik-rtr:
      # LOCAL: use Host(`localhost`) for local testing
      rule: 'Host(`localhost`)'
      # CLOUDFLARE: use your domain
      # rule: 'Host(`traefik.{{env "DOMAINNAME"}}`)'
      service: api@internal
      entryPoints:
        - https
      middlewares:
        # LOCAL: basic auth for local testing
        - chain-internal-basic-auth@file
        # CLOUDFLARE: Authelia SSO for production
        # - chain-internal-authelia@file
      tls: {}
